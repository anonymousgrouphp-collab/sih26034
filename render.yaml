services:
  - type: web
    name: nyayadrishti-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nyayadrishti-db
          property: connectionString
      - key: NYAYADRISHTI_SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8000

databases:
  - name: nyayadrishti-db
    plan: free
    region: singapore
    databaseName: nyayadrishti
    user: nyaya_admin
