services:
  - type: web
    name: nirikshak-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nirikshak-db
          property: connectionString
      - key: NIRIKSHAK_SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8000

databases:
  - name: nirikshak-db
    plan: free
    region: singapore
    databaseName: nirikshak
    user: nirikshak_admin
