<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bsaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE68A"/>
      <stop offset="50%" stopColor="#D97706"/>
      <stop offset="100%" stopColor="#78350F"/>
    </linearGradient>

    <linearGradient id="emeraldShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#064E3B"/>
      <stop offset="60%" stopColor="#065F46"/>
      <stop offset="100%" stopColor="#022C22"/>
    </linearGradient>

    <radialGradient id="merkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#10B981" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#064E3B" stopOpacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Octagonal Guilloche Certificate Outer Frame -->
  <polygon points="160,10 265,53 310,160 265,267 160,310 55,267 10,160 55,53" fill="none" stroke="url(#bsaGold)" stroke-width="3"/>
  <polygon points="160,18 259,58 302,160 259,262 160,302 61,262 18,160 61,58" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 2. Shield Body -->
  <path d="M 60,65 L 260,65 C 260,185 210,245 160,275 C 110,245 60,185 60,65 Z" fill="url(#emeraldShield)" stroke="url(#bsaGold)" stroke-width="2.5"/>

  <!-- Subtle Radial Glow in Shield -->
  <circle cx="160" cy="155" r="95" fill="url(#merkleGlow)"/>

  <!-- 3. Security Lathe / Cryptographic Merkle Tree Lattice in Background -->
  <g stroke="#10B981" stroke-width="0.8" opacity="0.3" fill="none">
    <circle cx="160" cy="145" r="70"/>
    <circle cx="160" cy="145" r="50"/>
    <circle cx="160" cy="145" r="30"/>
    <!-- Merkle Cross-Links -->
    <line x1="160" y1="75" x2="160" y2="215"/>
    <line x1="90" y1="145" x2="230" y2="145"/>
    <line x1="110" y1="95" x2="210" y2="195"/>
    <line x1="210" y1="95" x2="110" y2="195"/>
  </g>

  <!-- 4. Central Digital Evidence Lock & Hash Crest -->
  <!-- Padlock Shackle -->
  <path d="M 136,128 L 136,108 C 136,94 146,84 160,84 C 174,84 184,94 184,108 L 184,128" fill="none" stroke="url(#bsaGold)" stroke-width="6" stroke-linecap="round"/>
  <!-- Padlock Body -->
  <rect x="122" y="125" width="76" height="58" rx="8" fill="#0B1D3A" stroke="url(#bsaGold)" stroke-width="2.5"/>
  <!-- Keyhole & Optical Sensor Core -->
  <circle cx="160" cy="148" r="8" fill="#FDE68A"/>
  <polygon points="156,152 164,152 166,168 154,168" fill="#FDE68A"/>

  <!-- 5. Tamper-Evident SHA-256 Text Arc -->
  <text x="160" y="200" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" font-weight="900" fill="#FDE68A" letter-spacing="1">
    SHA-256 MERKLE SEAL
  </text>
  <text x="160" y="213" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#6EE7B7" letter-spacing="0.5">
    RFC 3161 NIC-TSA VERIFIED
  </text>

  <!-- 6. Bottom Banner / Statutory Citation Ribbon -->
  <g transform="translate(0, 10)">
    <rect x="45" y="222" width="230" height="24" rx="4" fill="#0F172A" stroke="url(#bsaGold)" stroke-width="1.5"/>
    <!-- Tricolor Flag accent on left and right -->
    <rect x="50" y="227" width="4" height="14" fill="#FF9933"/>
    <rect x="266" y="227" width="4" height="14" fill="#138808"/>
    <text x="160" y="238" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="9.5" font-weight="900" fill="#FDE68A" letter-spacing="1.2">
      SEC 63 BSA 2023 PROOF
    </text>
  </g>
</svg>
