<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <linearGradient id="verifiedEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399"/>
      <stop offset="50%" stopColor="#059669"/>
      <stop offset="100%" stopColor="#064E3B"/>
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE68A"/>
      <stop offset="50%" stopColor="#D97706"/>
      <stop offset="100%" stopColor="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Circular Wreath Starburst / 16-point Rosette -->
  <g fill="url(#verifiedEmerald)" stroke="url(#goldBorder)" stroke-width="2">
    <circle cx="140" cy="140" r="130"/>
    <circle cx="140" cy="140" r="120" stroke-dasharray="4 3" fill="none"/>
  </g>

  <!-- Inner Dark Sovereign Core -->
  <circle cx="140" cy="140" r="105" fill="#062E22" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Tricolor Arc Accent -->
  <path d="M 60,140 A 80,80 0 0,1 220,140" stroke="#FF9933" stroke-width="3" fill="none"/>
  <path d="M 60,140 A 80,80 0 0,0 220,140" stroke="#10B981" stroke-width="3" fill="none"/>

  <!-- Centered Statutory Checkmark -->
  <path d="M 102,138 L 128,164 L 182,110" fill="none" stroke="#FDE68A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outer Text Labels -->
  <text x="140" y="78" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" font-weight="900" fill="#FDE68A" letter-spacing="2">
    LMPC RULES, 2011
  </text>
  <text x="140" y="200" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" fill="#A7F3D0" letter-spacing="1">
    RULE 6 VERIFIED
  </text>
  <text x="140" y="216" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#6EE7B7" letter-spacing="0.5">
    TABLE-I COMPLIANT
  </text>
</svg>
