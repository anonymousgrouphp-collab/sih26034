<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <!-- Grid Pattern for Technical Drafting Sheet -->
    <pattern id="techGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    </pattern>
    <linearGradient id="flagGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="sensorCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Outer Technical Drafting Sheet Container -->
  <rect width="600" height="380" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="8" y="8" width="584" height="364" rx="8" fill="url(#techGrid)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Top Tricolor Ribbon -->
  <rect x="8" y="8" width="584" height="3.5" fill="url(#flagGradient)"/>

  <!-- Official Engineering Title Block Header -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="552" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Left emblem badge -->
    <rect x="8" y="7" width="28" height="28" rx="4" fill="#1B365D"/>
    <text x="22" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">LM</text>
    
    <text x="44" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0F172A" letter-spacing="0.3">विधिक मापविज्ञान तकनीकी विनिर्देश • STATUTORY TECHNICAL SPECIFICATION</text>
    <text x="44" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#475569">DOCA/LMPC/STD-01 • ArUco 50mm Co-Planar Fiducial &amp; PDP Optical Acquisition Geometry</text>
    
    <!-- Right spec pill -->
    <rect x="442" y="11" width="102" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="493" y="24" font-family="monospace" font-size="8.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">SEC. 15 LMPC '09</text>
  </g>

  <!-- CENTRAL TECHNICAL DRAWING WORKSPACE (y: 72 to 290) -->
  
  <!-- 1. PACKAGED COMMODITY (PRINCIPAL DISPLAY PANEL / PDP) -->
  <g transform="translate(36, 80)">
    <!-- Baseline Reference Surface -->
    <rect x="-10" y="148" width="190" height="20" rx="2" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="85" y="162" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#64748B" text-anchor="middle">हॉरिजॉन्टल तल • Reference Surface</text>

    <!-- Package Container Body -->
    <rect x="10" y="10" width="150" height="138" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8"/>
    <!-- PDP Header Identification Stripe -->
    <rect x="20" y="20" width="60" height="10" rx="2" fill="#0284C7"/>
    <rect x="85" y="22" width="65" height="6" rx="2" fill="#E2E8F0"/>
    <rect x="20" y="34" width="130" height="6" rx="2" fill="#F1F5F9"/>

    <!-- Rule 6 Statutory Declarations Bounding Box -->
    <rect x="20" y="52" width="130" height="84" rx="4" fill="#FEF3C7" fill-opacity="0.6" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="26" y="66" font-family="monospace" font-size="9" font-weight="800" fill="#92400E">NET QTY: 500 g</text>
    <text x="26" y="78" font-family="monospace" font-size="8" font-weight="700" fill="#B45309">MRP: ₹ 120.00 (INCL. TAXES)</text>
    <text x="26" y="89" font-family="monospace" font-size="7.5" font-weight="600" fill="#78350F">MFD: 08/2026 • REG: DL-SOUTH</text>
    <text x="26" y="100" font-family="monospace" font-size="7.5" font-weight="600" fill="#78350F">MFR: CONSUMER GOODS LTD.</text>
    <text x="26" y="111" font-family="monospace" font-size="7" font-weight="600" fill="#92400E">CUSTOMER CARE: 1800-11-4000</text>
    <text x="26" y="123" font-family="monospace" font-size="7" font-weight="700" fill="#065F46">COUNTRY OF ORIGIN: INDIA</text>

    <!-- Table-I Numeral Height Measurement Callout -->
    <line x1="102" y1="58" x2="102" y2="68" stroke="#D97706" stroke-width="1.2"/>
    <path d="M100 58H104M100 68H104" stroke="#D97706" stroke-width="1.2"/>
    <text x="106" y="65" font-family="monospace" font-size="7" font-weight="800" fill="#B45309">h ≥ 4.0mm</text>

    <!-- Station Label Badge -->
    <rect x="35" y="-4" width="100" height="18" rx="4" fill="#1B365D"/>
    <text x="85" y="8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">मुख्य प्रदर्शन फलक • PDP</text>

    <!-- Normal Vector Arrow n -->
    <line x1="85" y1="10" x2="85" y2="-18" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="2 2"/>
    <path d="M82 -16L85 -22L88 -16" fill="#0284C7"/>
    <text x="92" y="-12" font-family="serif" font-style="italic" font-size="9" font-weight="700" fill="#0284C7">n&#8407; &#8869; PDP</text>
  </g>

  <!-- 2. ARUCO 4X4 50MM CALIBRATION FIDUCIAL -->
  <g transform="translate(232, 126)">
    <!-- Ground surface continuation -->
    <rect x="-12" y="102" width="94" height="20" rx="2" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Outer Fiducial Plate (50mm Square) -->
    <rect x="0" y="10" width="70" height="70" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    
    <!-- 4x4 ArUco Matrix Inner Code -->
    <rect x="8" y="18" width="54" height="54" fill="#000000"/>
    <rect x="14" y="24" width="13.5" height="13.5" fill="#FFFFFF"/>
    <rect x="41" y="24" width="13.5" height="13.5" fill="#FFFFFF"/>
    <rect x="27.5" y="37.5" width="13.5" height="13.5" fill="#FFFFFF"/>
    <rect x="41" y="51" width="13.5" height="13.5" fill="#FFFFFF"/>

    <!-- Caliper Dimension Line 50.0 mm -->
    <line x1="0" y1="88" x2="70" y2="88" stroke="#D97706" stroke-width="1.5"/>
    <path d="M0 84V92M70 84V92" stroke="#D97706" stroke-width="1.5"/>
    <path d="M0 88L5 86V90ZM70 88L65 86V90Z" fill="#D97706"/>
    <text x="35" y="100" font-family="monospace" font-size="9" font-weight="900" fill="#B45309" text-anchor="middle">50.0 mm &#177;0.1mm</text>
    <text x="35" y="112" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">मानक अरूको संदर्भ</text>

    <!-- Badge above ArUco -->
    <rect x="2" y="-4" width="66" height="16" rx="3" fill="#065F46"/>
    <text x="35" y="7" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">सह-समतलीय</text>
  </g>

  <!-- OPTICAL FIELD OF VIEW & RAY PROJECTION -->
  <polygon points="460,82 46,140 310,140" fill="url(#sensorCone)"/>
  <line x1="460" y1="82" x2="110" y2="140" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="460" y1="82" x2="267" y2="140" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 3. HANDHELD INSPECTION SENSOR TERMINAL -->
  <g transform="translate(370, 75)">
    <!-- Terminal Outer Body (Professional Handheld Gov Inspection Terminal) -->
    <rect x="20" y="10" width="168" height="175" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    
    <!-- Top Sensor Array & Barcode Illuminator -->
    <rect x="74" y="16" width="60" height="7" rx="3.5" fill="#1E293B"/>
    <circle cx="86" cy="19.5" r="2.5" fill="#38BDF8"/>
    <circle cx="122" cy="19.5" r="2.5" fill="#10B981"/>

    <!-- High-Resolution Inspection Display Screen -->
    <rect x="30" y="28" width="148" height="145" rx="6" fill="#020617"/>

    <!-- Screen HUD: Live Optical Reticle -->
    <!-- PDP Bounding Box on screen -->
    <rect x="38" y="44" width="68" height="88" rx="3" fill="#0284C7" fill-opacity="0.12" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="42" y="54" font-family="monospace" font-size="6.5" font-weight="700" fill="#38BDF8">PDP: LOCKED</text>

    <!-- ArUco Bounding Box on screen -->
    <rect x="114" y="78" width="46" height="46" rx="2" fill="#059669" fill-opacity="0.15" stroke="#10B981" stroke-width="1.2"/>
    <text x="117" y="87" font-family="monospace" font-size="6.5" font-weight="700" fill="#10B981">&#10003; 50mm CAL</text>

    <!-- Crosshair Target Center -->
    <circle cx="104" cy="98" r="14" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="104" y1="80" x2="104" y2="116" stroke="#F59E0B" stroke-width="1"/>
    <line x1="86" y1="98" x2="122" y2="98" stroke="#F59E0B" stroke-width="1"/>

    <!-- Screen Bottom Telemetry Bar -->
    <rect x="34" y="146" width="140" height="22" rx="3" fill="#0F172A"/>
    <circle cx="44" cy="157" r="3.5" fill="#10B981"/>
    <text x="52" y="160" font-family="monospace" font-size="7" font-weight="700" fill="#E2E8F0">TILT: 0.8&#176; &#8226; 90&#176; ORTHOGONAL</text>

    <!-- Terminal Badge Header -->
    <rect x="46" y="-3" width="116" height="16" rx="3" fill="#1B365D"/>
    <text x="104" y="8" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">निरीक्षण टर्मिनल • SENSOR</text>

    <!-- Angle 90° Indicator -->
    <path d="M12 90 A 18 18 0 0 1 20 72" fill="none" stroke="#0284C7" stroke-width="1.5"/>
    <text x="-4" y="84" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#0284C7">&#952; = 90&#176;&#177;5&#176;</text>
  </g>

  <!-- BOTTOM STATUTORY PROTOCOL CHECKLIST PILLS (Plenty of safety margin: y: 300 to 358) -->
  <g transform="translate(24, 304)">
    <!-- Container Bar -->
    <rect x="0" y="0" width="552" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Pillar 1: 90° Orthogonal Plane -->
    <g transform="translate(12, 10)">
      <rect width="168" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="16" cy="16" r="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
      <path d="M12.5 16L15 18.5L19.5 13.5" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#0F172A">1. लंबवत 90° संरेखण</text>
      <text x="30" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#475569">Parallel 90° Orthogonal Axis</text>
    </g>

    <!-- Pillar 2: 50mm Co-planar Reference -->
    <g transform="translate(192, 10)">
      <rect width="168" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="16" cy="16" r="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
      <path d="M12.5 16L15 18.5L19.5 13.5" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#0F172A">2. 50mm सह-समतलीय मार्कर</text>
      <text x="30" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#475569">ArUco on Same Surface Plane</text>
    </g>

    <!-- Pillar 3: Diffuse Light / Zero Glare -->
    <g transform="translate(372, 10)">
      <rect width="168" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="16" cy="16" r="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
      <path d="M12.5 16L15 18.5L19.5 13.5" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#0F172A">3. विसरित प्रकाश • शून्य चमक</text>
      <text x="30" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#475569">Diffuse Lighting • Zero Glare</text>
    </g>
  </g>
</svg>
