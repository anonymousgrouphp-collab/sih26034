<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" fill="none">
  <defs>
    <!-- Background Technical Grid -->
    <pattern id="guideGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    </pattern>
    <!-- Indian Sovereign Flag Tricolor Gradient -->
    <linearGradient id="flagTricolor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <!-- Optical Cone Projection Gradient -->
    <linearGradient id="opticalCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Outer Sheet Container -->
  <rect width="680" height="400" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="6" y="6" width="668" height="388" rx="10" fill="url(#guideGrid)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Top Sovereign Tricolor Accent Ribbon -->
  <rect x="6" y="6" width="668" height="3.5" rx="1.5" fill="url(#flagTricolor)"/>

  <!-- 1. OFFICIAL ENGINEERING HEADER BLOCK (y: 16 to 62) -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="632" height="46" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Emblem Badge -->
    <rect x="10" y="8" width="30" height="30" rx="6" fill="#1B365D"/>
    <text x="25" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">LM</text>
    
    <!-- Title & Subtitle -->
    <text x="50" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="900" fill="#0F172A" letter-spacing="0.4">STATUTORY FIELD CAPTURE PROTOCOL</text>
    <text x="50" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#475569">Legal Metrology Packaged Commodities (LMPC) Rule 6 &amp; Table-I Verification • DOCA/LMPC/STD-01</text>
    
    <!-- Right Statutory Authority Pill -->
    <rect x="498" y="12" width="124" height="22" rx="5" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="560" y="27" font-family="monospace" font-size="9" font-weight="800" fill="#1D4ED8" text-anchor="middle">SEC. 15 LMPC '09</text>
  </g>

  <!-- REFERENCE DATUM SURFACE (y: 268) -->
  <rect x="24" y="268" width="632" height="18" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="340" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">REFERENCE HORIZONTAL SURFACE • CO-PLANAR CALIBRATION PLANE (समतल संदर्भ तल)</text>

  <!-- 2. STAGE COMPONENT 1: PACKAGED COMMODITY / PDP (x: 32, y: 76) -->
  <g transform="translate(32, 76)">
    <!-- Package Outer Body (Crisp packaging carton/pouch) -->
    <rect x="0" y="14" width="176" height="174" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8"/>
    
    <!-- Brand / Product Identification Header -->
    <rect x="12" y="26" width="70" height="12" rx="3" fill="#0284C7"/>
    <rect x="88" y="28" width="76" height="8" rx="2" fill="#E2E8F0"/>
    <text x="12" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#0F172A">PACKAGED COMMODITY</text>
    
    <!-- Mandatory Rule 6 Declarations Bounding Box -->
    <rect x="12" y="60" width="152" height="116" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3" stroke-dasharray="3.5 3.5"/>
    
    <!-- Clean, Non-overlapping Statutory Typography -->
    <text x="18" y="77" font-family="monospace" font-size="9.5" font-weight="800" fill="#92400E">NET QTY: 500 g</text>
    <text x="18" y="93" font-family="monospace" font-size="8.5" font-weight="700" fill="#B45309">MRP: ₹ 120.00 (INCL. TAXES)</text>
    <text x="18" y="108" font-family="monospace" font-size="8" font-weight="600" fill="#78350F">MFD: 08/2026 • REG: DL-09</text>
    <text x="18" y="122" font-family="monospace" font-size="8" font-weight="600" fill="#78350F">MFR: PACKAGED GOODS LTD.</text>
    <text x="18" y="136" font-family="monospace" font-size="7.5" font-weight="600" fill="#92400E">CARE: 1800-11-4000 (TOLL-FREE)</text>
    <text x="18" y="151" font-family="monospace" font-size="8" font-weight="800" fill="#065F46">ORIGIN: INDIA (भारत)</text>

    <!-- Table-I Numeral Height Measurement Callout -->
    <line x1="126" y1="68" x2="126" y2="80" stroke="#D97706" stroke-width="1.2"/>
    <path d="M123 68H129M123 80H129" stroke="#D97706" stroke-width="1.2"/>
    <text x="132" y="76" font-family="monospace" font-size="7" font-weight="800" fill="#B45309">h ≥ 4.0mm</text>

    <!-- Station Badge Header -->
    <rect x="36" y="2" width="104" height="20" rx="4" fill="#1B365D"/>
    <text x="88" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">1. PDP SURFACE (फलक)</text>
    
    <!-- Normal Orthogonal Vector -->
    <line x1="88" y1="2" x2="88" y2="-12" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="2 2"/>
    <path d="M85 -10L88 -15L91 -10" fill="#0284C7"/>
    <text x="96" y="-6" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#0284C7">n&#8407; &#8869; 90&#176;</text>
  </g>

  <!-- 3. STAGE COMPONENT 2: ARUCO 50MM CALIBRATION FIDUCIAL (x: 236, y: 130) -->
  <g transform="translate(236, 130)">
    <!-- Outer Fiducial Plate (50mm Physical Target) -->
    <rect x="0" y="12" width="76" height="76" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    
    <!-- 4x4 ArUco Matrix Inner Binary Code (Dict 4x4 #42) -->
    <rect x="9" y="21" width="58" height="58" fill="#000000"/>
    <rect x="16" y="28" width="14.5" height="14.5" fill="#FFFFFF"/>
    <rect x="45" y="28" width="14.5" height="14.5" fill="#FFFFFF"/>
    <rect x="30.5" y="42.5" width="14.5" height="14.5" fill="#FFFFFF"/>
    <rect x="45" y="57" width="14.5" height="14.5" fill="#FFFFFF"/>

    <!-- Dimension Caliper Line 50.0 mm -->
    <line x1="0" y1="96" x2="76" y2="96" stroke="#D97706" stroke-width="1.5"/>
    <path d="M0 92V100M76 92V100" stroke="#D97706" stroke-width="1.5"/>
    <path d="M0 96L5 94V98ZM76 96L71 94V98Z" fill="#D97706"/>
    <text x="38" y="108" font-family="monospace" font-size="9" font-weight="900" fill="#B45309" text-anchor="middle">50.0 mm &#177;0.1mm</text>
    <text x="38" y="119" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">CALIBRATION TARGET</text>

    <!-- Co-planar Station Badge -->
    <rect x="2" y="-2" width="72" height="18" rx="3" fill="#065F46"/>
    <text x="38" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">2. ArUco 50mm</text>
  </g>

  <!-- OPTICAL FIELD-OF-VIEW CONE & PERSPECTIVE RAYS -->
  <polygon points="495,84 120,96 312,206" fill="url(#opticalCone)"/>
  <line x1="495" y1="84" x2="120" y2="136" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="495" y1="84" x2="274" y2="170" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 4. STAGE COMPONENT 3: NIRIKSHAK FIELD CAMERA TERMINAL (x: 345, y: 74) -->
  <g transform="translate(345, 74)">
    <!-- Terminal Chassis (Clean Handheld Inspector Device) -->
    <rect x="20" y="12" width="280" height="174" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    
    <!-- Top Sensor Array & Indicator -->
    <rect x="130" y="17" width="60" height="6" rx="3" fill="#1E293B"/>
    <circle cx="142" cy="20" r="2.5" fill="#38BDF8"/>
    <circle cx="178" cy="20" r="2.5" fill="#10B981"/>

    <!-- High-Resolution Inspection Display Viewfinder -->
    <rect x="30" y="28" width="260" height="148" rx="8" fill="#020617"/>

    <!-- Screen Header HUD Bar -->
    <rect x="34" y="32" width="252" height="16" rx="4" fill="#0F172A"/>
    <circle cx="44" cy="40" r="3" fill="#EF4444" className="animate-pulse"/>
    <text x="52" y="43" font-family="monospace" font-size="7.5" font-weight="700" fill="#E2E8F0">LIVE SENSOR • NIRIKSHAK HUD • 1080p</text>
    <text x="278" y="43" font-family="monospace" font-size="7.5" font-weight="800" fill="#10B981" text-anchor="end">READY (सत्यापन)</text>

    <!-- Screen: PDP Bounding Reticle (Blue Box) -->
    <rect x="42" y="54" width="118" height="96" rx="4" fill="#0284C7" fill-opacity="0.12" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="46" y="65" font-family="monospace" font-size="7" font-weight="800" fill="#38BDF8">✓ PDP: LOCKED (500g)</text>

    <!-- Golden Corner Crosshairs on PDP -->
    <path d="M42 66V54H54" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M148 54H160V66" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M42 138V150H54" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M148 150H160V138" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Screen: ArUco Bounding Reticle (Green Box) -->
    <rect x="176" y="78" width="58" height="58" rx="3" fill="#059669" fill-opacity="0.16" stroke="#10B981" stroke-width="1.5"/>
    <text x="180" y="88" font-family="monospace" font-size="7" font-weight="800" fill="#10B981">✓ 50mm SCALE</text>
    <text x="180" y="98" font-family="monospace" font-size="6.5" font-weight="600" fill="#6EE7B7">1 px = 0.082mm</text>

    <!-- Center Target Crosshair Reticle -->
    <circle cx="160" cy="102" r="14" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="160" y1="84" x2="160" y2="120" stroke="#F59E0B" stroke-width="1"/>
    <line x1="142" y1="102" x2="178" y2="102" stroke="#F59E0B" stroke-width="1"/>

    <!-- Screen Bottom Telemetry & Multi-Capture Status -->
    <rect x="34" y="154" width="252" height="18" rx="3" fill="#0B132B"/>
    <circle cx="44" cy="163" r="3" fill="#10B981"/>
    <text x="52" y="166" font-family="monospace" font-size="7" font-weight="700" fill="#CBD5E1">TILT: 0.2&#176; &#8226; 90&#176; ORTHOGONAL &#8226; OPTIMAL LIGHT</text>
    <rect x="236" y="156" width="46" height="14" rx="2" fill="#059669"/>
    <text x="259" y="166" font-family="monospace" font-size="6.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">REEL (3)</text>

    <!-- Terminal Badge Header -->
    <rect x="80" y="0" width="160" height="20" rx="4" fill="#1B365D"/>
    <text x="160" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">3. FIELD CAMERA HUD (90° VIEW)</text>
  </g>

  <!-- 5. BOTTOM STATUTORY PROTOCOL PILLARS (Clean, 3-Card Row with ZERO OVERLAP: y: 300 to 380) -->
  <g transform="translate(24, 300)">
    <!-- Container Shield Bar -->
    <rect x="0" y="0" width="632" height="82" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Pillar 1: Parallel 90° Orthogonal Alignment -->
    <g transform="translate(10, 10)">
      <rect width="198" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <!-- Checkmark Badge -->
      <circle cx="20" cy="20" r="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <path d="M15.5 20L18.5 23L24.5 17" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <text x="36" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#0F172A">1. Parallel 90° Plane</text>
      <text x="36" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#047857">लंबवत 90° संरेखण</text>
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">Hold device directly parallel above PDP;</text>
      <text x="36" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">eliminates perspective skew for Table-I.</text>
    </g>

    <!-- Pillar 2: ArUco on Same Surface (Co-Planar 50mm) -->
    <g transform="translate(217, 10)">
      <rect width="198" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <!-- Checkmark Badge -->
      <circle cx="20" cy="20" r="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <path d="M15.5 20L18.5 23L24.5 17" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <text x="36" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#0F172A">2. ArUco on Same Surface</text>
      <text x="36" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#047857">सह-समतलीय 50mm संदर्भ</text>
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">Place 50mm marker in exact same plane</text>
      <text x="36" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">as package label for millimeter calibration.</text>
    </g>

    <!-- Pillar 3: Diffuse Light / Zero Direct Glare -->
    <g transform="translate(424, 10)">
      <rect width="198" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <!-- Checkmark Badge -->
      <circle cx="20" cy="20" r="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <path d="M15.5 20L18.5 23L24.5 17" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <text x="36" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#0F172A">3. No Direct Flash Glare</text>
      <text x="36" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#047857">विसरित प्रकाश • शून्य चमक</text>
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">Use even, ambient lighting without harsh</text>
      <text x="36" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">strobe glare over metallic / glossy foil text.</text>
    </g>
  </g>
</svg>
