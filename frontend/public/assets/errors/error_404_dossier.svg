<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Soft Background Container -->
  <circle cx="120" cy="90" r="75" fill="#FEF3C7" fill-opacity="0.3"/>
  
  <!-- Missing Dossier Binder -->
  <rect x="70" y="35" width="100" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Dossier Header Lines -->
  <rect x="85" y="50" width="70" height="8" rx="2" fill="#E2E8F0"/>
  <rect x="85" y="65" width="50" height="6" rx="2" fill="#F1F5F9"/>
  <rect x="85" y="77" width="60" height="6" rx="2" fill="#F1F5F9"/>

  <!-- "404" Stamped Across with Warning Angle -->
  <g transform="rotate(-12 120 100)">
    <rect x="65" y="85" width="110" height="32" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="120" y="107" font-family="monospace" font-size="20" font-weight="900" fill="#B45309" text-anchor="middle" letter-spacing="2">404 NOT FOUND</text>
  </g>

  <!-- Inspection Lens -->
  <circle cx="155" cy="115" r="22" fill="#FFFFFF" stroke="#071526" stroke-width="2.5"/>
  <circle cx="155" cy="115" r="16" fill="#F8FAFC"/>
  <text x="155" y="122" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#071526" text-anchor="middle">?</text>
  <line x1="171" y1="131" x2="188" y2="148" stroke="#071526" stroke-width="4" stroke-linecap="round"/>
</svg>
