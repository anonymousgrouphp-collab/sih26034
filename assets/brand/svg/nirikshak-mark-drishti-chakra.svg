<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-labelledby="dcTitle dcDesc">
  <title id="dcTitle">NIRIKSHAK — Drishti Chakra mark</title>
  <desc id="dcDesc">An outer measuring dial with graduation ticks encircles an Ashoka-chakra spoke rhythm whose void hub forms a lens around a saffron pupil: statutory India and optical inspection in one wheel.</desc>
  <defs>
    <radialGradient id="dcPupil" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#FFC069"/>
      <stop offset="0.55" stop-color="#FF9933"/>
      <stop offset="1" stop-color="#F07E00"/>
    </radialGradient>
    <line id="dcSpoke" x1="120" y1="49" x2="120" y2="86" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>
  </defs>
  <!-- measuring dial: outer ring + 24 graduation ticks (dash trick: short dash x thick stroke = radial tick) -->
  <circle cx="120" cy="120" r="104" stroke="#0A192F" stroke-width="4"/>
  <circle cx="120" cy="120" r="93" stroke="#64748B" stroke-width="8" stroke-dasharray="2.8 21.55"/>
  <!-- cardinal register ticks -->
  <g stroke="#0A192F" stroke-width="3" stroke-linecap="round">
    <path d="M120 20 L120 36"/>
    <path d="M220 120 L204 120"/>
    <path d="M120 220 L120 204"/>
    <path d="M20 120 L36 120"/>
  </g>
  <!-- chakra rim + 12 spokes -->
  <circle cx="120" cy="120" r="78" stroke="#0A192F" stroke-width="6"/>
  <use href="#dcSpoke"/>
  <use href="#dcSpoke" transform="rotate(30 120 120)"/>
  <use href="#dcSpoke" transform="rotate(60 120 120)"/>
  <use href="#dcSpoke" transform="rotate(90 120 120)"/>
  <use href="#dcSpoke" transform="rotate(120 120 120)"/>
  <use href="#dcSpoke" transform="rotate(150 120 120)"/>
  <use href="#dcSpoke" transform="rotate(180 120 120)"/>
  <use href="#dcSpoke" transform="rotate(210 120 120)"/>
  <use href="#dcSpoke" transform="rotate(240 120 120)"/>
  <use href="#dcSpoke" transform="rotate(270 120 120)"/>
  <use href="#dcSpoke" transform="rotate(300 120 120)"/>
  <use href="#dcSpoke" transform="rotate(330 120 120)"/>
  <!-- lens hub: emerald reticle ring around saffron pupil -->
  <circle cx="120" cy="120" r="26" stroke="#10B981" stroke-width="5.5"/>
  <circle cx="120" cy="120" r="13" fill="url(#dcPupil)"/>
  <circle cx="115.2" cy="115.2" r="3" fill="#FFFFFF" opacity="0.85"/>
</svg>
