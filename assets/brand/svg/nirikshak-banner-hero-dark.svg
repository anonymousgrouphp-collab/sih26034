<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="rmTitleDark rmDescDark">
  <title id="rmTitleDark">NIRIKSHAK README Header Banner (Dark)</title>
  <desc id="rmDescDark">Dark metrology emblem centered above NIRIKSHAK wordmark and Indian Department of Consumer Affairs attribution with status dots.</desc>

  <defs>
    <!-- Background Grid -->
    <pattern id="rmGridDark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>

    <!-- Subtle Centered Depth Gradient -->
    <radialGradient id="rmCenterRadial" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity=".3"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Pupil Core Glow -->
    <filter id="rmCoreGlowDark" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="rmGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="rmCyanDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="rmPanDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="#0D1117"/>
  <rect width="1200" height="420" rx="16" fill="url(#rmGridDark)"/>
  <rect width="1200" height="420" rx="16" fill="url(#rmCenterRadial)"/>
  <rect width="1200" height="420" rx="16" stroke="#30363D" stroke-width="1.5"/>

  <!-- ================= LOGO EMBLEM ================= -->
  <g transform="translate(600, 118)">
    <!-- Tech Guides -->
    <path d="M -115 -48 L -135 -48 L -135 48 L -115 48" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 115 -48 L 135 -48 L 135 48 L 115 48" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="-135" y1="0" x2="-124" y2="0" stroke="#FB923C" stroke-width="2.5"/>
    <line x1="135" y1="0" x2="124" y2="0" stroke="#FB923C" stroke-width="2.5"/>

    <!-- Reticle Circles -->
    <circle cx="0" cy="0" r="95" stroke="url(#rmGoldDark)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7"/>
    <circle cx="0" cy="0" r="84" stroke="url(#rmCyanDark)" stroke-width="1.6" opacity="0.8"/>
    <circle cx="0" cy="0" r="74" stroke="url(#rmGoldDark)" stroke-width="0.8" opacity="0.5"/>

    <!-- Balance Arms & Pans -->
    <g transform="translate(-95, 0)">
      <line x1="0" y1="0" x2="-26" y2="42" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="26" y2="42" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
      <path d="M -34 42 Q 0 66 34 42 Z" fill="url(#rmPanDark)" stroke="#E2E8F0" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="0" cy="44" r="2.5" fill="#FB923C"/>
    </g>
    <g transform="translate(95, 0)">
      <line x1="0" y1="0" x2="-26" y2="42" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="26" y2="42" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
      <path d="M -34 42 Q 0 66 34 42 Z" fill="url(#rmPanDark)" stroke="#E2E8F0" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="0" cy="44" r="2.5" fill="#FB923C"/>
    </g>

    <line x1="-95" y1="0" x2="-60" y2="0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="60" y1="0" x2="95" y2="0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Central Lens / Eye -->
    <path d="M -60 0 C -34 -36 34 -36 60 0 C 34 36 -34 36 -60 0 Z" fill="#0F172A" stroke="#F1F5F9" stroke-width="2.8"/>
    <path d="M -52 0 C -28 -28 28 -28 52 0 C 28 28 -28 28 -52 0 Z" stroke="url(#rmGoldDark)" stroke-width="1.4" fill="none"/>

    <circle cx="0" cy="0" r="26" fill="#1E293B" stroke="url(#rmGoldDark)" stroke-width="2"/>
    <g stroke="#F59E0B" stroke-width="1" opacity="0.85">
      <line x1="0" y1="-26" x2="0" y2="26"/>
      <line x1="-26" y1="0" x2="26" y2="0"/>
      <line x1="-18" y1="-18" x2="18" y2="18"/>
      <line x1="-18" y1="18" x2="18" y2="-18"/>
    </g>

    <circle cx="0" cy="0" r="11" fill="#030712"/>
    <circle cx="0" cy="0" r="4.5" fill="#FF9933" filter="url(#rmCoreGlowDark)"/>
    <circle cx="-3.5" cy="-3.5" r="2.2" fill="#FFFFFF"/>
    <circle cx="3.5" cy="3.5" r="1" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- ================= WORDMARK ================= -->
  <g transform="translate(484, 235) scale(0.48)">
    <g stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g stroke="#FFFFFF">
        <g transform="translate(0,50)"><path d="M8 100 L8 0 L56 100 L56 0"/></g>
        <g transform="translate(64,50)"><path d="M8 0 L8 100"/></g>
        <g transform="translate(90,50)"><path d="M8 100 L8 0 L26 0 A25 25 0 0 1 26 50 L8 50 M27 50 L56 100"/></g>
      </g>
      <g stroke="#93C5FD">
        <g transform="translate(156,50)"><path d="M8 0 L8 100"/></g>
        <g transform="translate(182,50)"><path d="M8 0 L8 100 M54 0 L8 50 M22 35 L56 100"/></g>
        <g transform="translate(246,50)"><path d="M48 14 C40 2 16 4 11 22 C6 40 28 45 37 51 C48 58 52 66 47 80 C41 96 14 96 8 82"/></g>
        <g transform="translate(302,50)"><path d="M8 0 L8 100 M56 0 L56 100 M8 50 L56 50"/></g>
        <g transform="translate(366,50)"><path d="M31 0 L6 100 M31 0 L56 100 M14 68 L48 68"/></g>
        <g transform="translate(428,50)"><path d="M8 0 L8 100 M54 0 L8 50 M22 35 L56 100"/></g>
      </g>
    </g>
    <circle cx="164" cy="27" r="7" stroke="#34D399" stroke-width="4.5"/>
    <circle cx="164" cy="27" r="2.4" fill="#FF9933"/>
  </g>

  <!-- ================= LABELS & VERDICT DOTS ================= -->
  <text x="600" y="334" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="600" letter-spacing="4.5" fill="#F0F6FC">
    LEGAL METROLOGY INSPECTION WORKSTATION
  </text>
  <text x="600" y="358" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#8B949E">
    Department of Consumer Affairs • Government of India
  </text>

  <g transform="translate(0, -3)">
    <circle cx="552" cy="386" r="4" fill="#34D399"/>
    <circle cx="584" cy="386" r="4" fill="#FBBF24"/>
    <circle cx="616" cy="386" r="4" fill="#F87171"/>
    <circle cx="648" cy="386" r="4" fill="#A78BFA"/>
  </g>
</svg>
