<svg viewBox="0 0 500 520" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="navyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="saffronGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="auraPurple" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraAmber" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Aura -->
  <rect width="500" height="520" fill="#FAFAFA" rx="16"/>
  <circle cx="100" cy="400" r="180" fill="url(#auraPurple)"/>
  <circle cx="400" cy="100" r="180" fill="url(#auraAmber)"/>

  <!-- Outer Concentric Calibration Rings -->
  <circle cx="250" cy="200" r="170" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>
  <circle cx="250" cy="200" r="158" stroke="url(#navyGrad1)" stroke-width="2.5" opacity="0.85"/>
  <circle cx="250" cy="200" r="146" stroke="url(#goldGrad1)" stroke-width="1" opacity="0.5"/>
  <circle cx="250" cy="200" r="132" stroke="url(#navyGrad1)" stroke-width="2" stroke-dasharray="1 3"/>

  <!-- Calibration Tick Marks (Metrology Scale) -->
  <g stroke="#0F2B5C" stroke-width="1.5" opacity="0.75">
    <line x1="250" y1="36" x2="250" y2="48" stroke-width="3" stroke="#EA580C"/>
    <line x1="250" y1="352" x2="250" y2="364" stroke-width="3" stroke="#EA580C"/>
    <line x1="86" y1="200" x2="98" y2="200" stroke-width="3" stroke="#EA580C"/>
    <line x1="402" y1="200" x2="414" y2="200" stroke-width="3" stroke="#EA580C"/>
    
    <line x1="134" y1="84" x2="142" y2="92"/>
    <line x1="366" y1="84" x2="358" y2="92"/>
    <line x1="134" y1="316" x2="142" y2="308"/>
    <line x1="366" y1="316" x2="358" y2="308"/>
  </g>

  <!-- 24-Spoke Dharma Chakra / Reticle Rays -->
  <g transform="translate(250, 200)" opacity="0.85">
    <circle cx="0" cy="0" r="108" stroke="url(#navyGrad1)" stroke-width="3" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="0" cy="0" r="102" stroke="url(#goldGrad1)" stroke-width="1"/>
    
    <!-- 24 Spokes -->
    <line x1="0" y1="0" x2="0" y2="-102" stroke="#1E3A8A" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="0" y2="102" stroke="#1E3A8A" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="-102" y2="0" stroke="#1E3A8A" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="102" y2="0" stroke="#1E3A8A" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="72" y2="72" stroke="#1E3A8A" stroke-width="2"/>
    <line x1="0" y1="0" x2="-72" y2="-72" stroke="#1E3A8A" stroke-width="2"/>
    <line x1="0" y1="0" x2="-72" y2="72" stroke="#1E3A8A" stroke-width="2"/>
    <line x1="0" y1="0" x2="72" y2="-72" stroke="#1E3A8A" stroke-width="2"/>
    <line x1="0" y1="0" x2="26" y2="-98" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-26" y2="-98" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="26" y2="98" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-26" y2="98" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="98" y2="-26" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-98" y2="-26" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="98" y2="26" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-98" y2="26" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="51" y2="-88" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-51" y2="-88" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="51" y2="88" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-51" y2="88" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="88" y2="-51" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-88" y2="-51" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="88" y2="51" stroke="#D4AF37" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-88" y2="51" stroke="#D4AF37" stroke-width="1.2"/>
  </g>

  <!-- Drishti: The Sovereign Eye -->
  <g transform="translate(250, 200)">
    <path d="M -90 0 C -50 -55 50 -55 90 0 C 50 55 -50 55 -90 0 Z" fill="#FFFFFF" stroke="#0F2B5C" stroke-width="4.5"/>
    <path d="M -80 0 C -45 -45 45 -45 80 0 C 45 45 -45 45 -80 0 Z" fill="none" stroke="url(#goldGrad1)" stroke-width="2"/>
    
    <!-- Iris -->
    <circle cx="0" cy="0" r="38" fill="url(#navyGrad1)" stroke="url(#goldGrad1)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="28" stroke="#FF9933" stroke-width="2" stroke-dasharray="4 2"/>
    
    <!-- Center Pupil / Laser Crosshair -->
    <circle cx="0" cy="0" r="15" fill="#0F172A"/>
    <circle cx="0" cy="0" r="6" fill="#FF9933" filter="url(#glow1)"/>
    
    <!-- Optical Highlights -->
    <circle cx="-6" cy="-6" r="4" fill="#FFFFFF"/>
    <circle cx="6" cy="6" r="2" fill="#FFFFFF" opacity="0.8"/>
    
    <line x1="-120" y1="0" x2="-95" y2="0" stroke="#FF9933" stroke-width="2"/>
    <line x1="95" y1="0" x2="120" y2="0" stroke="#FF9933" stroke-width="2"/>
  </g>

  <!-- Ashoka Pillar Motif at Top -->
  <g transform="translate(250, 48)">
    <rect x="-14" y="0" width="28" height="4" rx="2" fill="#D4AF37"/>
    <circle cx="0" cy="-6" r="4" fill="#1E3A8A"/>
  </g>

  <!-- Wordmark: NIRIKSHAK -->
  <text x="250" y="425" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="800" font-size="38" letter-spacing="6" fill="#0F2B5C">
    NIRIKSHAK
  </text>
  <rect x="180" y="438" width="140" height="3" rx="1.5" fill="url(#saffronGrad1)"/>

  <!-- Subtitle -->
  <text x="250" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#475569">
    LEGAL METROLOGY AI INSPECTOR
  </text>
  <text x="250" y="485" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1" fill="#EA580C">
    उपभोक्ता मामले विभाग · भारत सरकार
  </text>
</svg>
