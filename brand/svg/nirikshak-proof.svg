<svg viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Nirikshak validation proof: 75 retail packaging photos, 7 Golden Demonstration SKUs, 562 automated tests, and 4 uncertainty-aware verdict states">
  <defs>
    <pattern id="gridPR" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0L0 0 0 32" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="glowPR" cx="72%" cy="20%" r="62%">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".09"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="430" fill="#0d1117"/>
  <rect width="1200" height="430" fill="url(#gridPR)"/>
  <rect width="1200" height="430" fill="url(#glowPR)"/>

  <text x="42" y="46" font-family="Consolas,monospace" font-size="12"
        letter-spacing="2.5" font-weight="700" fill="#7ee787">REPRODUCIBLE PROOF</text>
  <line x1="220" y1="41" x2="1158" y2="41" stroke="#263140"/>

  <text x="42" y="83" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="23" font-weight="700" fill="#f0f6fc">
    Built to demonstrate the workflow, not just describe it.
  </text>

  <!-- Metric Cards -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <!-- Card 1: Photos -->
    <g transform="translate(42, 120)">
      <rect width="260" height="152" rx="14" fill="#161b22" stroke="#263140"/>
      <text x="24" y="38" font-family="Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#71717a">RETAIL PHOTOS</text>
      <text x="24" y="86" font-family="Consolas,monospace" font-size="36" font-weight="800" fill="#38bdf8">75</text>
      <text x="24" y="114" font-size="13" font-weight="600" fill="#f0f6fc">Packaging Photographs</text>
      <text x="24" y="135" font-size="11.5" fill="#8b949e">Physical FMCG commodities</text>
    </g>

    <!-- Card 2: Demo SKUs -->
    <g transform="translate(326, 120)">
      <rect width="260" height="152" rx="14" fill="#161b22" stroke="#263140"/>
      <text x="24" y="38" font-family="Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#71717a">DEMONSTRATION</text>
      <text x="24" y="86" font-family="Consolas,monospace" font-size="36" font-weight="800" fill="#a855f7">7</text>
      <text x="24" y="114" font-size="13" font-weight="600" fill="#f0f6fc">Golden SKUs</text>
      <text x="24" y="135" font-size="11.5" fill="#8b949e">Pre-packaged test fixtures</text>
    </g>

    <!-- Card 3: Tests -->
    <g transform="translate(610, 120)">
      <rect width="260" height="152" rx="14" fill="#161b22" stroke="#263140"/>
      <text x="24" y="38" font-family="Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#71717a">VERIFICATION</text>
      <text x="24" y="86" font-family="Consolas,monospace" font-size="36" font-weight="800" fill="#7ee787">562</text>
      <text x="24" y="114" font-size="13" font-weight="600" fill="#f0f6fc">Automated Tests</text>
      <text x="24" y="135" font-size="11.5" fill="#8b949e">55 files · 0 failed · 0 skipped</text>
    </g>

    <!-- Card 4: 4 States -->
    <g transform="translate(894, 120)">
      <rect width="264" height="152" rx="14" fill="#161b22" stroke="#263140"/>
      <text x="24" y="38" font-family="Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#71717a">OPERATIONAL STATES</text>
      <text x="24" y="86" font-family="Consolas,monospace" font-size="36" font-weight="800" fill="#f59e0b">4</text>
      <text x="24" y="114" font-size="13" font-weight="600" fill="#f0f6fc">Verdict States</text>
      <text x="24" y="135" font-size="11.5" fill="#8b949e">PASS · FAIL · REVIEW · UNABLE</text>
    </g>
  </g>

  <!-- Bottom Proof Bar -->
  <rect x="42" y="295" width="1116" height="100" rx="12" fill="#11161d" stroke="#1f4b3e"/>
  <text x="72" y="332" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#7ee787">
    REPRODUCIBLE VALIDATION
  </text>
  <text x="72" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">
    Every demonstration scenario is backed by versioned fixtures, OCR outputs, and rule-evaluation records.
  </text>
</svg>
