<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="icTitle icDesc">
  <title id="icTitle">NIRIKSHAK app icon</title>
  <desc id="icDesc">Sovereign navy app icon with the Drishti Chakra reduced to its boldest elements: white chakra rim and spokes, emerald reticle hub, saffron pupil. Legible from 512px down to 16px favicon.</desc>
  <defs>
    <linearGradient id="icDisc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F284E"/>
      <stop offset="1" stop-color="#071526"/>
    </linearGradient>
    <radialGradient id="icPupil" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#FFC069"/>
      <stop offset="0.55" stop-color="#FF9933"/>
      <stop offset="1" stop-color="#F07E00"/>
    </radialGradient>
    <line id="icSpoke" x1="256" y1="126" x2="256" y2="186" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#icDisc)"/>
  <circle cx="256" cy="256" r="150" stroke="#FFFFFF" stroke-width="20"/>
  <use href="#icSpoke"/>
  <use href="#icSpoke" transform="rotate(30 256 256)"/>
  <use href="#icSpoke" transform="rotate(60 256 256)"/>
  <use href="#icSpoke" transform="rotate(90 256 256)"/>
  <use href="#icSpoke" transform="rotate(120 256 256)"/>
  <use href="#icSpoke" transform="rotate(150 256 256)"/>
  <use href="#icSpoke" transform="rotate(180 256 256)"/>
  <use href="#icSpoke" transform="rotate(210 256 256)"/>
  <use href="#icSpoke" transform="rotate(240 256 256)"/>
  <use href="#icSpoke" transform="rotate(270 256 256)"/>
  <use href="#icSpoke" transform="rotate(300 256 256)"/>
  <use href="#icSpoke" transform="rotate(330 256 256)"/>
  <circle cx="256" cy="256" r="56" stroke="#34D399" stroke-width="15"/>
  <circle cx="256" cy="256" r="30" fill="url(#icPupil)"/>
  <circle cx="246.5" cy="246.5" r="6.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
