<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 30 116 76" fill="none" role="img" aria-labelledby="leTitle leDesc">
  <title id="leTitle">NIRIKSHAK — Level Eye mark</title>
  <desc id="leDesc">A spirit level read as an eye: a true horizontal beam is the lower lid, a calm arc is the upper lid, and the verification iris rests between them exactly within tolerance — the officer's attention present at the precise point of measurement. The inspector's instrument and the inspector's gaze in one silhouette.</desc>
  <radialGradient id="lePupil" cx="0.38" cy="0.32" r="0.9">
    <stop offset="0" stop-color="#FFC069"/>
    <stop offset="0.55" stop-color="#FF9933"/>
    <stop offset="1" stop-color="#F07E00"/>
  </radialGradient>
  <!-- upper lid: the calm arc of the gaze -->
  <path d="M14 90 A50.5 50.5 0 0 1 114 90" stroke="#0A192F" stroke-width="7" stroke-linecap="round"/>
  <!-- lower lid: the true line of the standard -->
  <path d="M14 90 L114 90" stroke="#0A192F" stroke-width="7" stroke-linecap="round"/>
  <!-- iris bubble resting in tolerance -->
  <circle cx="64" cy="68" r="10" stroke="#059669" stroke-width="6"/>
  <circle cx="64" cy="68" r="4.5" fill="url(#lePupil)"/>
  <circle cx="62" cy="66" r="1.3" fill="#FFFFFF" opacity="0.85"/>
</svg>
