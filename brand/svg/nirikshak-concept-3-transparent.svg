<svg viewBox="0 0 500 520" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shutterGrad3T" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="beamGrad3T" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Outer Circular Chassis & Orbiting Nodes -->
  <circle cx="250" cy="195" r="165" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>
  <circle cx="250" cy="195" r="150" stroke="#1E293B" stroke-width="4"/>
  <circle cx="250" cy="195" r="135" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>

  <!-- 4 Orbit Nodes -->
  <circle cx="250" cy="45" r="6" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>
  <circle cx="250" cy="345" r="6" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>
  <circle cx="100" cy="195" r="6" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>
  <circle cx="400" cy="195" r="6" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>

  <!-- Camera Shutter Aperture Blades Inside -->
  <g transform="translate(250, 195)">
    <circle cx="0" cy="0" r="115" fill="url(#shutterGrad3T)"/>
    
    <!-- Aperture Blades -->
    <path d="M 0 -115 C 40 -80 70 -30 65 20 L 0 0 Z" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <path d="M 100 -57 C 95 0 60 50 10 70 L 0 0 Z" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <path d="M 100 57 C 55 90 0 95 -45 65 L 0 0 Z" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <path d="M 0 115 C -40 80 -70 30 -65 -20 L 0 0 Z" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <path d="M -100 57 C -95 0 -60 -50 -10 -70 L 0 0 Z" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <path d="M -100 -57 C -55 -90 0 -95 45 -65 L 0 0 Z" fill="#1E293B" stroke="#475569" stroke-width="1"/>

    <!-- HUD Reticle Grid Overlay -->
    <g stroke="#38BDF8" stroke-width="1" opacity="0.45">
      <line x1="-115" y1="0" x2="115" y2="0"/>
      <line x1="0" y1="-115" x2="0" y2="115"/>
      <rect x="20" y="-80" width="70" height="70" fill="none" stroke-dasharray="2 3"/>
      <path d="M 30 -70 L 40 -70 M 30 -70 L 30 -60"/>
      <path d="M 80 -70 L 70 -70 M 80 -70 L 80 -60"/>
      <path d="M 30 -20 L 40 -20 M 30 -20 L 30 -30"/>
      <path d="M 80 -20 L 70 -20 M 80 -20 L 80 -30"/>
    </g>

    <!-- Archer Silhouette with Bow & Arrow of Laser Light -->
    <g transform="translate(-30, 20)">
      <path d="M -50 40 C -45 10 -35 -10 -25 -25 C -15 -10 -5 15 -10 40 Z" fill="#EA580C" opacity="0.9"/>
      <circle cx="-25" cy="-35" r="10" fill="#EA580C"/>
      <path d="M -25 -20 L 15 -15 L 25 -10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M -25 -20 L -45 -10 L -35 5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M 15 -60 C 40 -20 40 10 15 40" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
      <line x1="15" y1="-60" x2="-35" y2="-10" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
      <line x1="15" y1="40" x2="-35" y2="-10" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
      
      <!-- Arrow of Laser Light Piercing Reticle -->
      <line x1="-35" y1="-10" x2="105" y2="-60" stroke="url(#beamGrad3T)" stroke-width="3.5"/>
      <polygon points="105,-60 92,-52 96,-66" fill="#FDE047"/>
      <circle cx="105" cy="-60" r="8" fill="#38BDF8" opacity="0.8"/>
      <circle cx="105" cy="-60" r="4" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Integrated Typographic Mark -->
  <g transform="translate(70, 420)">
    <!-- Stylized 'N' with Camera Lens Integration -->
    <g transform="translate(10, -5)">
      <circle cx="15" cy="0" r="22" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
      <circle cx="15" cy="0" r="14" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1.5"/>
      <path d="M 0 15 C 25 -20 30 -20 45 15" stroke="#EA580C" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Wordmark: NIRIKSHAK -->
    <text x="70" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="5" fill="#0F172A">
      IRIKSHAK
    </text>
  </g>

  <!-- Taglines -->
  <text x="250" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#1D4ED8">
    AI LEGAL METROLOGY & QUALITY ENGINE
  </text>
  <text x="250" y="488" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748B">
    स्वचालित विधिक निरीक्षण एवं उपभोक्ता विश्वास
  </text>
</svg>
