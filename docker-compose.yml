version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Relational Datastore (Mode A Online Monolith)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: nirikshak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nirikshak
      POSTGRES_USER: nirikshak_admin
      POSTGRES_PASSWORD: StatutoryEnforcement@2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirikshak_admin -d nirikshak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend & Live AI Legal Metrology Pipeline
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirikshak-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nirikshak_admin:StatutoryEnforcement@2026@db:5432/nirikshak
      NIRIKSHAK_SECRET_KEY: Nirikshak-sec63-bsa2023-statutory-secret-key-prod-delhi-01
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/backend/storage

  # ---------------------------------------------------------------------------
  # 3. React 18 + Nginx Production Frontend Workstation
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nirikshak-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
    name: nirikshak_pgdata
  storage_data:
    name: nirikshak_storage
