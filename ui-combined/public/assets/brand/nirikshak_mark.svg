<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Precision Outer Metrology Calibration Ring -->
  <circle cx="24" cy="24" r="22" stroke="#071526" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="24" cy="24" r="22" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 8" stroke-dashoffset="2"/>
  
  <!-- Optical Reticle Crosshairs -->
  <line x1="24" y1="3" x2="24" y2="7" stroke="#071526" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="41" x2="24" y2="45" stroke="#071526" stroke-width="2" stroke-linecap="round"/>
  <line x1="3" y1="24" x2="7" y2="24" stroke="#071526" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="24" x2="45" y2="24" stroke="#071526" stroke-width="2" stroke-linecap="round"/>

  <!-- Solid Navy Shield Container -->
  <rect x="8" y="8" width="32" height="32" rx="8" fill="#071526"/>
  
  <!-- Balanced Scale Beam (Nyaya) -->
  <path d="M16 20H32" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Central Vernier Caliper / Optical Axis (Drishti) -->
  <line x1="24" y1="14" x2="24" y2="34" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="24" cy="14" r="2" fill="#F59E0B"/>
  
  <!-- Left Scale Pan -->
  <path d="M16 20L13 26H19L16 20Z" fill="#38BDF8" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Right Scale Pan -->
  <path d="M32 20L29 26H35L32 20Z" fill="#38BDF8" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Heavy Ground Fulcrum Base -->
  <path d="M19 34H29" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
</svg>
