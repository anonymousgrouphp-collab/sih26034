<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
<defs>
  <linearGradient id="cleanerBg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  <linearGradient id="cleanerPack" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#38bdf8"/><stop offset=".4" stop-color="#0284c7"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
  <filter id="cleanShadow"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity=".35"/></filter>
</defs>
<rect width="900" height="1100" fill="url(#cleanerBg)"/>
<!-- Notice: NO ArUco marker on this surface! Simulates uncalibrated field photograph -->
<g transform="translate(40 80)">
  <rect width="100" height="100" rx="8" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="50" y="55" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">No Fiducial</text>
  <text x="50" y="70" font-family="sans-serif" font-size="9" fill="#f87171" text-anchor="middle">Marker</text>
</g>
<!-- Bottle Contour -->
<g filter="url(#cleanShadow)">
  <path d="M380 70 L520 70 L530 180 L620 280 L630 960 Q450 1000 270 960 L280 280 L370 180 Z" fill="url(#cleanerPack)" stroke="#0284c7" stroke-width="6"/>
  <!-- Trigger Spray Cap -->
  <rect x="390" y="30" width="120" height="40" rx="4" fill="#0369a1"/>
  <path d="M510 50 L560 50 L570 75 L525 75 Z" fill="#0284c7"/>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <!-- Brand Header -->
  <text x="450" y="360" font-size="44" font-weight="900" fill="#fff" letter-spacing="1">CLEANHOME</text>
  <text x="450" y="405" font-size="20" font-weight="700" fill="#bae6fd">SURFACE DISINFECTANT</text>

  <!-- Net Weight Box -->
  <g transform="translate(320 490)">
    <rect width="260" height="85" rx="10" fill="#075985"/>
    <text x="130" y="36" font-size="16" font-weight="700" fill="#7dd3fc">NET WEIGHT</text>
    <text x="130" y="72" font-size="36" font-weight="900" fill="#fff">250 g</text>
  </g>

  <!-- MRP Box -->
  <g transform="translate(320 620)">
    <rect width="260" height="80" rx="8" fill="#fff"/>
    <text x="130" y="32" font-size="15" font-weight="bold" fill="#0284c7">MAXIMUM RETAIL PRICE</text>
    <text x="130" y="66" font-size="30" font-weight="900" fill="#0f172a">₹ 99.00</text>
  </g>
  <text x="450" y="730" font-size="14" font-weight="bold" fill="#e0f2fe">(INCL. OF ALL TAXES)</text>

  <text x="450" y="820" font-size="14" fill="#bae6fd">Mfg by: CleanHome Chemical Industries Ltd, Vapi 396195</text>
  <text x="450" y="850" font-size="12" font-family="monospace" fill="#94a3b8">Batch: CH26M014 • Pkd: 07/2026</text>
</g>
</svg>
