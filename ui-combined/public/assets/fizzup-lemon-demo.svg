<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
<defs>
  <linearGradient id="lemonBg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14532d"/><stop offset="1" stop-color="#052e16"/></linearGradient>
  <linearGradient id="bottleGrad" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#bef264"/><stop offset=".3" stop-color="#facc15"/><stop offset=".8" stop-color="#eab308"/><stop offset="1" stop-color="#ca8a04"/></linearGradient>
  <filter id="fizzShadow"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity=".35"/></filter>
</defs>
<rect width="900" height="1100" fill="url(#lemonBg)"/>
<!-- Calibrated Reference Grid -->
<g opacity=".12" stroke="#fff" stroke-width="4">
  <path d="M0 170h900M0 340h900M0 510h900M0 680h900M0 850h900"/>
  <path d="M150 0v1100M300 0v1100M450 0v1100M600 0v1100M750 0v1100"/>
</g>
<!-- ArUco 4x4 50mm Calibration Fiducial Marker -->
<g transform="translate(40 80)">
  <rect width="100" height="100" fill="#fff" stroke="#111" stroke-width="3"/>
  <rect x="15" y="15" width="70" height="70" fill="#000"/>
  <!-- ArUco ID 1 -->
  <rect x="25" y="25" width="15" height="15" fill="#fff"/>
  <rect x="55" y="40" width="15" height="15" fill="#fff"/>
  <rect x="40" y="55" width="15" height="15" fill="#fff"/>
  <text x="50" y="112" font-family="monospace" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">ArUco 50mm</text>
</g>
<!-- Bottle Contour -->
<g filter="url(#fizzShadow)">
  <path d="M360 40 L540 40 L540 130 L650 250 L660 980 Q450 1020 240 980 L250 250 L360 130 Z" fill="url(#bottleGrad)" stroke="#65a30d" stroke-width="6"/>
  <!-- Bottle Cap -->
  <rect x="375" y="20" width="150" height="30" rx="6" fill="#15803d" stroke="#166534" stroke-width="3"/>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <!-- Brand Header -->
  <text x="450" y="320" font-size="52" font-weight="900" fill="#166534" letter-spacing="2">FIZZUP</text>
  <text x="450" y="370" font-size="26" font-weight="800" fill="#15803d">SPARKLING LEMON</text>

  <!-- Net Volume Box -->
  <g transform="translate(320 440)">
    <rect width="260" height="80" rx="10" fill="#166534"/>
    <text x="130" y="34" font-size="16" font-weight="700" fill="#bef264">NET QUANTITY</text>
    <text x="130" y="68" font-size="36" font-weight="900" fill="#fff">1 L</text>
  </g>

  <!-- CONFLICTING DUAL MRP MARKINGS (Rule 18(1) Violation) -->
  <!-- Marking 1: Printed Label MRP -->
  <g transform="translate(200 580)">
    <rect width="230" height="90" rx="8" fill="#fff" stroke="#166534" stroke-width="3"/>
    <text x="115" y="30" font-size="14" font-weight="bold" fill="#166534">ORIGINAL MRP</text>
    <text x="115" y="68" font-size="30" font-weight="900" fill="#0f172a">₹ 45.00</text>
    <text x="115" y="82" font-size="9" fill="#64748b">(incl. all taxes)</text>
  </g>

  <!-- Marking 2: Overstamped Inkjet MRP (CONTRADICTORY) -->
  <g transform="translate(470 580)">
    <rect width="230" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 3"/>
    <text x="115" y="30" font-size="14" font-weight="bold" fill="#dc2626">OVERPRINTED MRP</text>
    <text x="115" y="68" font-size="30" font-weight="900" fill="#dc2626">₹ 48.00</text>
    <text x="115" y="82" font-size="9" fill="#991b1b">⚠️ DUAL PRICING</text>
  </g>

  <text x="450" y="730" font-size="16" font-weight="bold" fill="#14532d">REFRESHING CITRUS CARBONATED BEVERAGE</text>
  <text x="450" y="780" font-size="14" fill="#14532d">Mfg by: FizzUp Beverages Pvt Ltd, Pune 411001</text>
  <text x="450" y="810" font-size="12" font-family="monospace" fill="#334155">Batch: FZ26L891 • Pkd: 08/2026</text>
</g>
</svg>
